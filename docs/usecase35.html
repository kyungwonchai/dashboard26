<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브코딩 직장인 활용사례 35선 & 제작 스크립트 전문 뷰어</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css?v=1793115300">
  <style>
    body {
      background: #07080d;
      color: #f1f3f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: 'Pretendard', sans-serif;
    }

    .viewer-navbar {
      height: 60px;
      background: rgba(14, 16, 23, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 50;
    }

    .btn-download-pptx {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .btn-download-pptx:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
    }

    .usecase-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .usecase-sidebar {
      width: 340px;
      background: #0a0c14;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .usecase-sidebar-search {
      padding: 12px 14px;
      background: rgba(7, 8, 13, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .usecase-sidebar-search input {
      width: 100%;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .usecase-sidebar-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .usecase-nav-item {
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: #94a3b8;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .usecase-nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }
    .usecase-nav-item.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
      font-weight: 700;
    }
    .usecase-num-pill {
      font-family: monospace;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .usecase-content-area {
      flex: 1;
      overflow-y: auto;
      padding: 30px 24px 80px;
      background: #040508;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .usecase-card-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .case-card {
      background: rgba(14, 16, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 24px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s ease;
    }
    .case-card:hover {
      border-color: rgba(245, 158, 11, 0.4);
    }

    .case-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .case-theme-tag {
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .case-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      margin: 8px 0 0 0;
      letter-spacing: -0.02em;
    }

    .info-section {
      margin-bottom: 14px;
    }
    .info-label {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .label-intent { color: #38bdf8; }
    .label-knowhow { color: #34d399; }
    .label-prompt { color: #c084fc; }

    .info-box {
      background: #090b12;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .prompt-box {
      background: #080a10;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 10px;
      padding: 16px;
      position: relative;
    }

    .prompt-pre {
      font-family: 'Pretendard', sans-serif;
      font-size: 13px;
      line-height: 1.7;
      color: #f1f5f9;
      white-space: pre-wrap;
      margin: 0;
    }

    .btn-copy-prompt {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #e9d5ff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-copy-prompt:hover {
      background: rgba(168, 85, 247, 0.4);
      color: #fff;
    }

    .terms-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid rgba(255, 255, 255, 0.2);
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* 플로팅 탑 버튼 */
    .btn-floating-top {
      position: fixed;
      bottom: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      z-index: 100;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <header class="viewer-navbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="./" class="btn btn-sub" style="text-decoration:none; padding:6px 10px;" title="홈으로 이동">
        ← 메인 목록
      </a>
      <span style="font-size:11px; font-weight:800; padding:3px 9px; border-radius:6px; background:rgba(245,158,11,0.2); color:#fbbf24; border:1px solid rgba(245,158,11,0.4);">
        💼 직장인 실전 활용집
      </span>
      <h2 style="font-size:15px; font-weight:700; margin:0; color:#fff;" id="page-header-title">
        바이브코딩 직장인 활용사례 35선 & 제작 스크립트
      </h2>
    </div>

    <div style="display:flex; align-items:center; gap:10px;">
      <a href="./바이브코딩_직장인_활용사례35.pptx" download="바이브코딩_직장인_활용사례35.pptx" class="btn-download-pptx" title="원본 PPTX 파일 다운로드">
        📥 원본 PPTX 다운로드 (249KB)
      </a>
    </div>
  </header>

  <!-- 메인 2단 -->
  <div class="usecase-layout">
    <!-- 좌측 사이드바: 35개 사례 목록 -->
    <aside class="usecase-sidebar">
      <div class="usecase-sidebar-search">
        <input type="text" id="sidebar-search-input" placeholder="사례명·키워드 빠른 검색 (예: 엑셀, 이메일...)" oninput="filterCases(this.value)">
      </div>
      <div class="usecase-sidebar-list" id="usecase-sidebar-list">
        <!-- JS 동적 생성 -->
      </div>
    </aside>

    <!-- 우측 본문: 사례 카드 목록 -->
    <main class="usecase-content-area" id="usecase-content-area">
      <div class="usecase-card-container" id="usecase-card-container">
        <!-- JS 동적 생성 -->
      </div>
    </main>
  </div>

  <button class="btn-floating-top" onclick="scrollToTop()" title="맨 위로 이동">
    ▲
  </button>

  <script src="data.js?v=1793115300"></script>
  <script>
    let casesData = [];

    function initUsecaseViewer() {
      if (typeof USECASE35_DATA !== 'undefined' && Array.isArray(USECASE35_DATA)) {
        casesData = USECASE35_DATA;
      }
      renderSidebar();
      renderContent();
    }

    function renderSidebar() {
      const listEl = document.getElementById('usecase-sidebar-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      casesData.forEach((item, idx) => {
        // Only show case slides or intro
        const itemEl = document.createElement('div');
        itemEl.className = 'usecase-nav-item';
        itemEl.id = 'nav-item-' + item.slideIndex;

        const isCase = item.caseNum !== '';
        itemEl.innerHTML = `
          <span class="usecase-num-pill">${isCase ? item.caseNum : String(item.slideIndex).padStart(2, '0')}</span>
          <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            ${item.caseName ? item.caseName : item.title}
          </span>
        `;
        itemEl.onclick = () => {
          scrollToCard(item.slideIndex);
        };
        listEl.appendChild(itemEl);
      });
    }

    function renderContent() {
      const container = document.getElementById('usecase-card-container');
      if (!container) return;
      container.innerHTML = '';

      casesData.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'case-card';
        card.id = 'case-card-' + item.slideIndex;

        if (item.caseNum) {
          // 정식 사례 카드
          card.innerHTML = `
            <div class="case-header">
              <div>
                <span class="case-theme-tag">${item.theme || '업무 활용'}</span>
                <h3 class="case-title">${item.title}</h3>
              </div>
              <span style="font-family:monospace; font-size:12px; color:#f59e0b; font-weight:700;">#사례 ${item.caseNum} / 35</span>
            </div>

            ${item.intent ? `
              <div class="info-section">
                <div class="info-label label-intent">🎯 기획 의도</div>
                <div class="info-box">${item.intent}</div>
              </div>
            ` : ''}

            ${item.knowhow ? `
              <div class="info-section">
                <div class="info-label label-knowhow">💡 강사 실무 노하우</div>
                <div class="info-box">${item.knowhow}</div>
              </div>
            ` : ''}

            ${item.prompt ? `
              <div class="info-section">
                <div class="info-label label-prompt">🤖 AI에게 이렇게 시키세요 (실전 프롬프트)</div>
                <div class="prompt-box">
                  <button class="btn-copy-prompt" onclick="copyPromptText(${item.slideIndex})">복사</button>
                  <pre class="prompt-pre" id="prompt-text-${item.slideIndex}">${escapeHtml(item.prompt)}</pre>
                </div>
              </div>
            ` : ''}

            ${item.terms ? `
              <div class="terms-box">${escapeHtml(item.terms)}</div>
            ` : ''}
          `;
        } else {
          // 인트로 / 가이드 슬라이드
          card.innerHTML = `
            <div class="case-header">
              <div>
                <span class="case-theme-tag">가이드 & 요약</span>
                <h3 class="case-title">${item.title}</h3>
              </div>
              <span style="font-family:monospace; font-size:12px; color:#94a3b8;">Slide ${item.slideIndex}</span>
            </div>
            <div style="font-size:13.5px; line-height:1.8; color:#cbd5e1; white-space:pre-wrap;">
              ${item.rawTexts.slice(1).join('\n\n')}
            </div>
          `;
        }
        container.appendChild(card);
      });
    }

    function scrollToCard(slideIdx) {
      const card = document.getElementById('case-card-' + slideIdx);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        card.style.borderColor = '#f59e0b';
        setTimeout(() => { card.style.borderColor = ''; }, 1500);
      }
      document.querySelectorAll('.usecase-nav-item').forEach(el => el.classList.remove('active'));
      const navItem = document.getElementById('nav-item-' + slideIdx);
      if (navItem) navItem.classList.add('active');
    }

    function copyPromptText(slideIdx) {
      const el = document.getElementById('prompt-text-' + slideIdx);
      if (!el) return;
      navigator.clipboard.writeText(el.textContent).then(() => {
        alert('📋 실전 프롬프트가 복사되었습니다!\nAI에게 그대로 붙여넣어 실행하세요.');
      });
    }

    function filterCases(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll('.usecase-nav-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function scrollToTop() {
      document.getElementById('usecase-content-area').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('DOMContentLoaded', initUsecaseViewer);
  </script>
</body>
</html>
