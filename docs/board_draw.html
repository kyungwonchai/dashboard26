<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>강사 전용 모바일 칠판 스튜디오 (Whiteboard Studio Pro)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #07080d;
      --bg-panel: rgba(14, 16, 23, 0.95);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #8b5cf6;
      --accent-pink: #ec4899;
    }
    * { box-sizing: border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
    body { background: var(--bg); color: #f1f3f9; font-family: 'Pretendard', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* 상단 프로페셔널 헤더 */
    header {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
    .brand span { font-size: 18px; }
    .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: rgba(16,185,129,0.15); color: #34d399; font-weight: 600; }

    /* 고기능 모바일 최적화 툴바 */
    .toolbar-container {
      background: #0e1017;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 12px;
      z-index: 90;
    }
    .tool-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .tool-row::-webkit-scrollbar { display: none; }

    /* 도구 탭 / 버튼 */
    .btn-tool {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #9ba1b6;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-tool:active, .btn-tool.active {
      background: rgba(139, 92, 246, 0.2);
      border-color: #8b5cf6;
      color: #fff;
    }

    /* 컬러 팔레트 도트 */
    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    /* 줌 / 패닝 컨트롤 */
    .zoom-indicator {
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* 전송 버튼 (네온 그라데이션) */
    .btn-send {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      margin-left: auto;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(236,72,153,0.4);
    }

    /* 뷰포트 & 캔버스 랩 */
    .canvas-viewport {
      flex: 1;
      position: relative;
      background: #07080d;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      cursor: crosshair;
    }

    /* 그리드 배경 오버레이 */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-size: 30px 30px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      pointer-events: none;
    }

    /* 하단 상태바 */
    footer {
      background: #0e1017;
      padding: 6px 14px;
      font-size: 11px;
      color: #656b82;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🎨</span>
      <div>강사 모바일 판서 스튜디오 Pro</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="status-badge" id="sync-status">실시간 대기중</span>
      <button class="btn-send" onclick="sendToStudents()">🚀 칠판 전송</button>
    </div>
  </header>

  <!-- 프로급 도구함 -->
  <div class="toolbar-container">
    <!-- 1행: 색상 및 그리기 모드 -->
    <div class="tool-row">
      <!-- 펜 / 형광펜 / 도형 / 텍스트 / 손가락이동 -->
      <button class="btn-tool active" id="tool-pen" onclick="setMode('pen')">✏️ 펜</button>
      <button class="btn-tool" id="tool-highlighter" onclick="setMode('highlighter')">🖍️ 형광펜</button>
      <button class="btn-tool" id="tool-rect" onclick="setMode('rect')">◻️ 사각</button>
      <button class="btn-tool" id="tool-circle" onclick="setMode('circle')">⭕ 원</button>
      <button class="btn-tool" id="tool-arrow" onclick="setMode('arrow')">➔ 화살표</button>
      <button class="btn-tool" id="tool-text" onclick="setMode('text')">🔤 글자</button>
      <button class="btn-tool" id="tool-eraser" onclick="setMode('eraser')">🧹 지우개</button>
      <button class="btn-tool" id="tool-pan" onclick="setMode('pan')">✋ 화면이동</button>
    </div>

    <!-- 2행: 컬러 팔레트 & 줌 컨트롤 -->
    <div class="tool-row">
      <div class="color-dot active" style="background:#ffffff;" onclick="setColor('#ffffff', this)"></div>
      <div class="color-dot" style="background:#ef4444;" onclick="setColor('#ef4444', this)"></div>
      <div class="color-dot" style="background:#f59e0b;" onclick="setColor('#f59e0b', this)"></div>
      <div class="color-dot" style="background:#10b981;" onclick="setColor('#10b981', this)"></div>
      <div class="color-dot" style="background:#38bdf8;" onclick="setColor('#38bdf8', this)"></div>
      <div class="color-dot" style="background:#a78bfa;" onclick="setColor('#a78bfa', this)"></div>
      <div class="color-dot" style="background:#ec4899;" onclick="setColor('#ec4899', this)"></div>

      <div style="height:18px; width:1px; background:var(--border); margin:0 4px;"></div>

      <!-- 확대/축소 버튼 -->
      <button class="btn-tool" onclick="zoomChange(-0.2)">🔍-</button>
      <span class="zoom-indicator" id="zoom-text">100%</span>
      <button class="btn-tool" onclick="zoomChange(0.2)">🔍+</button>
      <button class="btn-tool" onclick="zoomReset()">리셋</button>

      <div style="height:18px; width:1px; background:var(--border); margin:0 4px;"></div>

      <!-- 취소 / 전체 비우기 -->
      <button class="btn-tool" onclick="undo()">↩️ 되돌리기</button>
      <button class="btn-tool" onclick="clearCanvas()">🗑️ 비우기</button>
    </div>
  </div>

  <!-- 칠판 캔버스 영역 -->
  <div class="canvas-viewport" id="viewport">
    <div class="grid-bg"></div>
    <canvas id="mainCanvas"></canvas>
  </div>

  <footer>
    <span>💡 <b>팁:</b> 두 손가락 핀치 줌으로 확대/축소 가능 · ✋화면이동 모드로 넓은 칠판 탐색</span>
    <span id="last-time">전송 기록 없음</span>
  </footer>

  <script>
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzj7R66hw1P6suB-emsCr52oIPEjDlOK2I2ho9TZ9f0KjgT2CT3MV9OMiw2xTVGjTSX/exec";

    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    // 캔버스 가상 크기 (무한 칠판 느낌의 넓은 해상도: 3000 x 2000)
    const VIRTUAL_WIDTH = 3200;
    const VIRTUAL_HEIGHT = 2000;
    canvas.width = VIRTUAL_WIDTH;
    canvas.height = VIRTUAL_HEIGHT;

    // 상태 관리
    let scale = 1.0;
    let panX = 0;
    let panY = 0;

    let currentMode = 'pen'; // 'pen', 'highlighter', 'rect', 'circle', 'arrow', 'text', 'eraser', 'pan'
    let currentColor = '#ffffff';
    let currentLineWidth = 5;

    let isDrawing = false;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;

    // 되돌리기(Undo) 히스토리
    let history = [];
    const MAX_HISTORY = 15;

    // 초기 배경 채우기
    function initCanvasBackground() {
      ctx.fillStyle = '#07080d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }
    initCanvasBackground();

    // 뷰포트 트랜스폼 렌더링 (CSS 하드웨어 가속)
    function applyTransform() {
      canvas.style.transformOrigin = '0 0';
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      document.getElementById('zoom-text').textContent = Math.round(scale * 100) + '%';
    }

    // 초기 화면 중앙 맞춤
    function centerView() {
      const vRect = viewport.getBoundingClientRect();
      scale = 0.5; // 모바일 화면에 맞게 기본 50% 뷰
      panX = (vRect.width - VIRTUAL_WIDTH * scale) / 2;
      panY = (vRect.height - VIRTUAL_HEIGHT * scale) / 2;
      applyTransform();
    }
    window.addEventListener('resize', centerView);
    setTimeout(centerView, 100);

    // 좌표 변환 (스크린 좌표 ➔ 가상 캔버스 좌표)
    function screenToCanvas(screenX, screenY) {
      const rect = viewport.getBoundingClientRect();
      const clientX = screenX - rect.left;
      const clientY = screenY - rect.top;
      return {
        x: (clientX - panX) / scale,
        y: (clientY - panY) / scale
      };
    }

    // 모드 설정
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.btn-tool').forEach(b => {
        if (b.id && b.id.startsWith('tool-')) b.classList.remove('active');
      });
      const activeBtn = document.getElementById('tool-' + mode);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function setColor(color, el) {
      currentColor = color;
      if (currentMode === 'eraser' || currentMode === 'pan') {
        setMode('pen');
      }
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    // 줌 조절
    function zoomChange(delta) {
      const newScale = Math.min(Math.max(0.2, scale + delta), 2.5);
      const vRect = viewport.getBoundingClientRect();
      const cx = vRect.width / 2;
      const cy = vRect.height / 2;

      panX = cx - (cx - panX) * (newScale / scale);
      panY = cy - (cy - panY) * (newScale / scale);
      scale = newScale;
      applyTransform();
    }

    function zoomReset() {
      centerView();
    }

    // Undo 관리
    function saveState() {
      if (history.length >= MAX_HISTORY) history.shift();
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undo() {
      if (history.length > 1) {
        history.pop(); // 현재 상태 제거
        const prevState = history[history.length - 1];
        ctx.putImageData(prevState, 0, 0);
      }
    }

    function clearCanvas() {
      if (confirm('칠판 전체를 깨끗하게 비우시겠습니까?')) {
        ctx.fillStyle = '#07080d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        saveState();
      }
    }

    // 멀티터치 핀치 줌 & 드로잉 엔진
    let initialPinchDist = null;
    let initialScale = 1;

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        // 2개 손가락 = 핀치 줌
        isDrawing = false;
        isPanning = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
        return;
      }

      if (e.touches.length === 1) {
        handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      e.preventDefault();

      if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDist / initialPinchDist;
        scale = Math.min(Math.max(0.2, initialScale * factor), 2.5);
        applyTransform();
        return;
      }

      if (e.touches.length === 1) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      initialPinchDist = null;
      handlePointerUp();
    });

    // 마우스 이벤트
    viewport.addEventListener('mousedown', (e) => {
      handlePointerDown(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => {
      handlePointerMove(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => {
      handlePointerUp();
    });

    // 공통 포인터 다운
    let snapshotBeforeShape = null;

    function handlePointerDown(clientX, clientY) {
      if (currentMode === 'pan') {
        isPanning = true;
        lastX = clientX;
        lastY = clientY;
        return;
      }

      isDrawing = true;
      const cPos = screenToCanvas(clientX, clientY);
      startX = cPos.x;
      startY = cPos.y;
      lastX = cPos.x;
      lastY = cPos.y;

      if (['rect', 'circle', 'arrow'].includes(currentMode)) {
        snapshotBeforeShape = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }

      if (currentMode === 'text') {
        isDrawing = false;
        const text = prompt('칠판에 입력할 글자를 입력하세요:', '');
        if (text) {
          ctx.font = 'bold 36px "Pretendard", sans-serif';
          ctx.fillStyle = currentColor;
          ctx.fillText(text, startX, startY);
          saveState();
        }
        return;
      }

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    // 공통 포인터 무브
    function handlePointerMove(clientX, clientY) {
      if (isPanning) {
        panX += clientX - lastX;
        panY += clientY - lastY;
        lastX = clientX;
        lastY = clientY;
        applyTransform();
        return;
      }

      if (!isDrawing) return;

      const cPos = screenToCanvas(clientX, clientY);

      if (currentMode === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentLineWidth;
        ctx.lineTo(cPos.x, cPos.y);
        ctx.stroke();
      } else if (currentMode === 'highlighter') {
        ctx.strokeStyle = currentColor + '55'; // 반투명
        ctx.lineWidth = currentLineWidth * 4;
        ctx.lineTo(cPos.x, cPos.y);
        ctx.stroke();
      } else if (currentMode === 'eraser') {
        ctx.strokeStyle = '#07080d';
        ctx.lineWidth = currentLineWidth * 5;
        ctx.lineTo(cPos.x, cPos.y);
        ctx.stroke();
      } else if (['rect', 'circle', 'arrow'].includes(currentMode)) {
        // 도형 실시간 가이드 미리보기
        if (snapshotBeforeShape) {
          ctx.putImageData(snapshotBeforeShape, 0, 0);
        }
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentLineWidth;

        if (currentMode === 'rect') {
          ctx.strokeRect(startX, startY, cPos.x - startX, cPos.y - startY);
        } else if (currentMode === 'circle') {
          const radius = Math.hypot(cPos.x - startX, cPos.y - startY);
          ctx.beginPath();
          ctx.arc(startX, startY, radius, 0, Math.PI * 2);
          ctx.stroke();
        } else if (currentMode === 'arrow') {
          drawArrow(ctx, startX, startY, cPos.x, cPos.y, currentLineWidth);
        }
      }
    }

    // 공통 포인터 업
    function handlePointerUp() {
      if (isPanning) {
        isPanning = false;
        return;
      }
      if (isDrawing) {
        isDrawing = false;
        ctx.closePath();
        snapshotBeforeShape = null;
        saveState();
      }
    }

    // 화살표 그리기 함수
    function drawArrow(context, fromx, fromy, tox, toy, width) {
      const headlen = 24;
      const angle = Math.atan2(toy - fromy, tox - fromx);
      context.beginPath();
      context.moveTo(fromx, fromy);
      context.lineTo(tox, toy);
      context.stroke();

      context.beginPath();
      context.moveTo(tox, toy);
      context.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
      context.moveTo(tox, toy);
      context.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
      context.stroke();
    }

    // 🚀 학생 화면으로 전송 (고해상도 다운샘플링 전송)
    async function sendToStudents() {
      const statusEl = document.getElementById('sync-status');
      statusEl.textContent = '전송 중...';
      statusEl.style.background = 'rgba(245,158,11,0.2)';
      statusEl.style.color = '#f59e0b';

      // 전송용 임시 캔버스 (전송 효율과 화질 밸런스: 1600 x 1000)
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 1600;
      exportCanvas.height = 1000;
      const expCtx = exportCanvas.getContext('2d');
      expCtx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);

      const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.82);

      const payload = {
        author: '채경원 (강사)',
        type: '칠판',
        content: dataUrl
      };

      try {
        await fetch(GOOGLE_SHEET_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');

        statusEl.textContent = '전송 완료 (' + timeStr + ')';
        statusEl.style.background = 'rgba(16,185,129,0.2)';
        statusEl.style.color = '#10b981';
        document.getElementById('last-time').textContent = '최근 전송: ' + timeStr;
        alert('🎉 수강생 칠판으로 성공적으로 전송되었습니다!\n학생 화면에 4초 이내로 자동 최신화됩니다.');
      } catch (err) {
        statusEl.textContent = '전송 실패';
        statusEl.style.background = 'rgba(239,68,68,0.2)';
        statusEl.style.color = '#ef4444';
        alert('전송 중 오류 발생: ' + err);
      }
    }
  </script>
</body>
</html>
