<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini CLI 대시보드 심화 (dashboard26) · 바이브코딩 인터랙티브 가이드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 네비게이션 헤더 -->
  <header class="docs-header">
    <div class="header-inner">
      <div class="logo-box">
        <span class="badge-icon">⚡</span>
        <div>
          <h1>Gemini CLI 대시보드 심화 (dashboard26)</h1>
          <p class="sub">바이브코딩 단계별 커리큘럼 & 브라우저 가상 동작 시뮬레이터</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="https://github.com/kyungwonchai/dashboard26" target="_blank" class="btn btn-github">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          전체 소스코드 ZIP 다운로드
        </a>
      </div>
    </div>
  </header>

  <!-- 메인 2단 레이아웃 (좌: 목차 및 프롬프트 가이드 / 우: 가상 웹앱 시뮬레이터) -->
  <div class="main-container">
    <!-- 좌측: STEP별 강의 목차 및 프롬프트 복사기 -->
    <aside class="sidebar-guide">
      <div class="guide-title">
        <span>📖 실습 목차 (STEP 01 ~ 11)</span>
        <span class="badge-step" id="current-step-badge">STEP 01</span>
      </div>

      <div class="steps-list" id="steps-container">
        <!-- 동적 렌더링 -->
      </div>
    </aside>

    <!-- 우측: 해당 단계의 동작 시뮬레이션 및 프롬프트 설명창 -->
    <main class="content-simulator">
      <!-- 프롬프트 카드 -->
      <section class="prompt-box glass-card">
        <div class="prompt-header">
          <div>
            <span class="tag-cat" id="prompt-part-tag">PART 1</span>
            <h2 id="prompt-step-title">STEP 01. 프로젝트 규칙 GEMINI.md</h2>
          </div>
          <button class="btn btn-copy" onclick="copyPrompt()">📋 Gemini CLI 프롬프트 복사</button>
        </div>
        <p class="prompt-desc" id="prompt-explanation">
          초보자도 알기 쉬운 원리 설명이 여기에 표시됩니다.
        </p>
        <div class="code-block-wrapper">
          <pre><code id="prompt-text"></code></pre>
        </div>
        <div class="mission-tip" id="mission-tip-box">
          💡 <b>나만의 변형 미션:</b> <span id="mission-tip-text"></span>
        </div>
      </section>

      <!-- 실제 동작 시뮬레이터 (브라우저 창 형태) -->
      <section class="simulator-window glass-card">
        <div class="browser-header">
          <div class="browser-dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <div class="browser-url">
            <span>🔒 http://127.0.0.1:10211/</span>
            <span class="url-badge" id="sim-badge">STEP 01 완성 상태</span>
          </div>
          <div class="browser-ctrls">
            <button onclick="resetDemoData()">🔄 가상 DB 초기화</button>
          </div>
        </div>

        <!-- 시뮬레이터 웹앱 본체 -->
        <div class="sim-body" id="sim-app-viewport">
          <!-- 동적으로 각 단계별 완성된 UI가 활성화되어 렌더링됨 -->
        </div>
      </section>
    </main>
  </div>

  <script src="demo.js"></script>
</body>
</html>
